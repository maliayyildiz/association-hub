# Local development services (CLAUDE.md §17, SAD §15).
# Image tags are major-version pins; Renovate keeps them current.
name: dernekhub

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dernekhub
      POSTGRES_PASSWORD: dernekhub
      POSTGRES_DB: dernekhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dernekhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dernekhub
      MINIO_ROOT_PASSWORD: dernekhub-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Captures outgoing e-mail; UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Phase 2 search (ADR-011); kept here so local setup matches CLAUDE.md §17.
  meilisearch:
    image: getmeili/meilisearch:v1
    environment:
      MEILI_MASTER_KEY: dernekhub-local-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  minio-data:
  meili-data:
